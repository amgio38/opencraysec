# Dependency policy, enforced by `cargo deny check` on every push (see .github/workflows/ci.yml,
# `make deny` and scripts/preflight.sh).
#
# The accounting side of this policy (the licence texts we must ship and the crate-by-crate list) is
# THIRD-PARTY-LICENSES.md and licenses/deps.tsv, generated by scripts/gen-third-party-licenses.py and
# checked against Cargo.lock by scripts/check-licenses.sh.

[advisories]
# A yanked or vulnerable dependency is a defect in a project that ships binaries, and a defect that is
# especially hard to defend in a tool that reports other people's vulnerable dependencies.
yanked = "deny"
# Known vulnerabilities are always denied. `unmaintained` and `unsound` stay warnings: neither means
# today's build is broken, and denying them would make routine upgrades fail for no reason a
# maintainer can act on.

[licenses]
# Every licence in the tree, and nothing else. A new expression fails the build.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Mozilla CA bundle data shipped by webpki-roots (TLS trust anchors for the HTTPS client).
    "CDLA-Permissive-2.0",
]
# MPL-2.0 and the like are not on the list on purpose. Adding one is a decision with a written
# reason, not a build fix.
#
# `version_check` 0.9.5 declares `MIT/Apache-2.0`. That is not valid SPDX: `/` is not an operator, so a
# strict parser cannot read it and `cargo deny` can report the license as unknown. The crate is
# genuinely dual MIT/Apache-2.0 upstream, which is the same election every other dual dependency in
# the tree makes -- but the fix belongs upstream, not in a rule written here to swallow a bad
# expression. Until then this is recorded rather than worked around; see THIRD-PARTY-LICENSES.md.
#
# `r-efi` declares `MIT OR Apache-2.0 OR LGPL-2.1-or-later`. The LGPL option is never taken -- MIT is
# offered and is what we use -- so a deny list naming "LGPL" must not be read as a finding about this
# tree.

[bans]
# Warn, not deny: duplicate versions in the tree are upstream-version facts that a `deny` here would
# only paper over. If a *new* duplicate appears, this warning is where it shows up first.
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are private (publish = false); only their own path dependencies may omit a
# version. Registry dependencies still may not use wildcards.
allow-wildcard-paths = true

[sources]
# Crates.io only: no git dependencies, no alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
