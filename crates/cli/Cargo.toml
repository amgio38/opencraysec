[package]
name = "opencraysec-cli"
description = "opencraysec: dependency vulnerability checks for AI harnesses (CLI and MCP server)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
opencraysec-core.workspace = true
opencraysec-engine.workspace = true
opencraysec-log.workspace = true
opencraysec-db.workspace = true
opencraysec-runtime.workspace = true
opencraysec-mcp.workspace = true
opencraysec-web.workspace = true
serde.workspace = true
serde_json.workspace = true
opencraysec-lockfile.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true
flate2.workspace = true
opencraysec-db = { workspace = true, features = ["testutil"] }

[[bin]]
name = "opencraysec"
path = "src/main.rs"
