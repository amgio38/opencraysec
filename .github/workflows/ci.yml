name: ci

# Everything a pull request must pass before it can be merged. Each step is also runnable
# locally: see the same commands in the Makefile and scripts/preflight.sh.
on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI never needs to write to the repository. release.yml asks for
# `contents: write` because it uploads assets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt, clippy, test, checks
    runs-on: ubuntu-latest
    # The tests start local mock servers and a dashboard; a hang must not hold the runner until
    # GitHub's 6-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The toolchain is pinned in rust-toolchain.toml as well; the action is referenced by its
      # version tag (not a moving branch) and installs rustfmt/clippy up front.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: layering check
        run: |
          scripts/check-layering.sh
          scripts/check-layering.test.sh

      - name: license and release hygiene check
        run: scripts/check-licenses.sh

      - name: third-party licence inventory is current
        run: python3 scripts/gen-third-party-licenses.py --check

      - name: installer tests (network stubbed)
        run: scripts/install-sh.test.sh

      # deny.toml is a policy only if something runs it. Before this step a copyleft or yanked
      # dependency merged as readily as a good one.
      - name: install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: cargo deny (licenses, bans, advisories)
        run: cargo deny --all-features check licenses bans advisories sources

      - name: documentation check
        run: scripts/check-docs.sh

      # scripts/preflight.sh is what a contributor runs before pushing; it is only worth anything
      # if it is the same list as this file. This fails when they drift.
      - name: preflight matches CI
        run: |
          scripts/check-preflight-parity.sh
          scripts/check-preflight-parity.test.sh

  coverage:
    name: line coverage (90% per crate and per file)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: coverage gate
        run: scripts/check-coverage.sh

  # The release binaries are Linux, but people build from source on other systems. This job finds out
  # whether the workspace still compiles and passes its tests there. Both jobs are required: a red
  # one fails the workflow, so `scripts/release.sh` will not tag the commit. (The installer is still
  # POSIX shell; Windows is covered here for building and testing, not for installing.)
  portable:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace --locked
